<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fox Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      background: #060811;
      color: #eef0fb;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px;
      overflow-x: hidden;
    }

    /* ── Background orbs ── */
    .orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
    }
    .orb-a {
      width: 540px; height: 540px;
      background: radial-gradient(circle, #7c5cff 0%, transparent 70%);
      top: -170px; left: -170px;
      opacity: 0.28;
      animation: floatA 18s ease-in-out infinite;
    }
    .orb-b {
      width: 460px; height: 460px;
      background: radial-gradient(circle, #24d6c8 0%, transparent 70%);
      bottom: -130px; right: -130px;
      opacity: 0.22;
      animation: floatB 15s ease-in-out infinite;
    }
    .orb-c {
      width: 320px; height: 320px;
      background: radial-gradient(circle, #ffba4a 0%, transparent 70%);
      top: 40%; left: 52%;
      opacity: 0.11;
      animation: floatC 22s ease-in-out infinite;
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(44px, 32px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(-34px, -42px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translate(0, 0); }
      33%       { transform: translate(22px, -28px); }
      66%       { transform: translate(-18px, 22px); }
    }

    /* ── Layout wrapper ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 56px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(125deg, #a78bfa 0%, #38bdf8 55%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.88rem;
      color: #4b5675;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(276px, 1fr));
      gap: 14px;
      width: 100%;
    }

    /* ── Card ── */
    .card {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 26px 22px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.032);
      border: 1px solid rgba(255, 255, 255, 0.068);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        background 0.24s ease,
        border-color 0.24s ease,
        transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.24s ease;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--c-glow);
      opacity: 0;
      transition: opacity 0.24s;
      pointer-events: none;
    }
    .card:hover {
      background: rgba(255, 255, 255, 0.058);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-5px) scale(1.008);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.52), var(--c-shadow);
    }
    .card:hover::after { opacity: 1; }
    .card:active {
      transform: translateY(-2px) scale(1.003);
      transition-duration: 0.1s;
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 18px;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover .icon-wrap { transform: scale(1.12); }
    .icon-wrap svg {
      width: 25px;
      height: 25px;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* ── Text ── */
    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #e8eaf8;
      margin-bottom: 7px;
    }
    .card-desc {
      font-size: 0.81rem;
      color: #4e586f;
      line-height: 1.58;
      flex: 1;
    }

    /* ── Footer hint ── */
    .card-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      color: #3a4262;
      margin-top: 18px;
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.22s, transform 0.22s;
    }
    .card:hover .card-hint { opacity: 1; transform: translateX(0); }
    .card-hint svg {
      width: 13px; height: 13px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Page footer ── */
    .footer {
      font-size: 0.72rem;
      color: #252b3a;
      letter-spacing: 0.06em;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .logo-title { font-size: 2.2rem; }
      body { padding: 36px 16px; }
      .wrap { gap: 40px; }
    }
  </style>
</head>
<body>

<div class="orbs">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<div class="wrap">

  <header class="header">
    <div class="logo">
      <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fg" x1="0" y1="0" x2="54" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#a78bfa"/>
            <stop offset="50%"  stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#34d399"/>
          </linearGradient>
        </defs>
        <path d="M8 25 L15 3 L23 23 Z"  fill="url(#fg)" opacity="0.9"/>
        <path d="M46 25 L39 3 L31 23 Z" fill="url(#fg)" opacity="0.9"/>
        <ellipse cx="27" cy="32" rx="18" ry="16" fill="url(#fg)" opacity="0.82"/>
        <circle cx="21"  cy="29" r="2.5" fill="#060811"/>
        <circle cx="33"  cy="29" r="2.5" fill="#060811"/>
        <circle cx="21.8" cy="28.1" r="0.75" fill="white" opacity="0.55"/>
        <circle cx="33.8" cy="28.1" r="0.75" fill="white" opacity="0.55"/>
        <ellipse cx="27" cy="36" rx="2" ry="1.35" fill="#060811"/>
      </svg>
      <span class="logo-title">FOX HUB</span>
    </div>
    <p class="logo-sub">Обери сайт для запуску</p>
  </header>

  <main id="grid" class="grid"></main>

  <footer class="footer">FoxTerminal · Local Sites</footer>
</div>

<script>
const SITES = [
  {
    name: 'Type Writer',
    desc:  'Практика набору тексту з різними рівнями та режимами',
    url:   '../typewriter/index.html',
    color: '#2dd4bf',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <rect x="2" y="4" width="20" height="16" rx="2.5"/>
      <path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01"/>
      <path d="M6 13h.01M10 13h.01M14 13h.01M18 13h.01"/>
      <path d="M7 17h10"/>
    </svg>`
  },
  {
    name: 'Fox Snake',
    desc:  'Класична змійка з кількома режимами та повним налаштуванням',
    url:   '../snake/index.html',
    color: '#86efac',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <rect x="2" y="8" width="20" height="12" rx="5"/>
      <path d="M9 8V5.5a3 3 0 0 1 6 0V8"/>
      <path d="M9 14h.01M15 14h.01"/>
      <path d="M9 12v4M7 14h4"/>
      <circle cx="17" cy="13" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="17" cy="16" r="1.2" fill="currentColor" stroke="none"/>
    </svg>`
  },
  {
    name: 'Invoker Forge',
    desc:  'Тренажер комбо Invoker зі справжніми іконками вмінь',
    url:   '../invoker/index.html',
    color: '#fbbf24',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/>
    </svg>`
  },
  {
    name: 'Techies Minefield',
    desc:  'Мінсвіпер у стилі Dota 2 з проксіміті-мінами Techies',
    url:   '../techies-sweeper/index.html',
    color: '#f87171',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <circle cx="12" cy="15" r="7"/>
      <line x1="12" y1="8" x2="12" y2="5"/>
      <line x1="8.8" y1="8.8" x2="6.8" y2="6.8"/>
      <line x1="15.2" y1="8.8" x2="17.2" y2="6.8"/>
      <path d="M17.5 5 L20 3"/>
    </svg>`
  },
  {
    name: 'Dice Forge',
    desc:  'Анімований 3D-кубик із темами Default, DND та Dota',
    url:   '../dice-forge/index.html',
    color: '#c084fc',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <rect x="2" y="2" width="20" height="20" rx="4"/>
      <circle cx="8"  cy="8"  r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="8"  r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="8"  cy="16" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/>
    </svg>`
  },
  {
    name: 'Dota Randomizer',
    desc:  'Рандомайзер предметів Dota 2 з українськими секціями',
    url:   '../dota-items-randomizer/index.html',
    color: '#fb923c',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <polyline points="16 3 21 3 21 8"/>
      <line x1="4" y1="20" x2="21" y2="3"/>
      <polyline points="21 16 21 21 16 21"/>
      <line x1="15" y1="15" x2="21" y2="21"/>
    </svg>`
  },
  {
    name: 'Web UI Guide',
    desc:  'Повний гайд по UI/CSS: приклади, документація, патерни',
    url:   '../web-ui-guide/index.html',
    color: '#38bdf8',
    icon: `<svg viewBox="0 0 24 24" stroke="currentColor">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>`
  }
];

const ARROW = `<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

const grid = document.getElementById('grid');

SITES.forEach(({ name, desc, url, color, icon }) => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = url;
  card.style.setProperty('--c-glow',   `radial-gradient(ellipse at 0% 0%, ${color}12 0%, transparent 65%)`);
  card.style.setProperty('--c-shadow', `0 0 50px ${color}16`);

  card.innerHTML = `
    <div class="icon-wrap"
         style="background:${color}18; box-shadow: 0 0 0 1px ${color}2e; color:${color}">
      ${icon}
    </div>
    <div class="card-name">${name}</div>
    <div class="card-desc">${desc}</div>
    <div class="card-hint">${ARROW} відкрити</div>
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
