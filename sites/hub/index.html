<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fox Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      background: #070a14;
      color: #f1f3fb;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 24px 48px;
      overflow-x: hidden;
    }

    .orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
    }
    .orb-a {
      width: 620px; height: 620px;
      background: radial-gradient(circle, #7c5cff 0%, transparent 70%);
      top: -190px; left: -180px;
      opacity: 0.42;
      animation: floatA 18s ease-in-out infinite;
    }
    .orb-b {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #24d6c8 0%, transparent 70%);
      bottom: -150px; right: -140px;
      opacity: 0.32;
      animation: floatB 15s ease-in-out infinite;
    }
    .orb-c {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #ffba4a 0%, transparent 70%);
      top: 38%; left: 48%;
      opacity: 0.18;
      animation: floatC 22s ease-in-out infinite;
    }
    @keyframes floatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(44px, 32px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-34px, -42px); }
    }
    @keyframes floatC {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(22px, -28px); }
      66% { transform: translate(-18px, 22px); }
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 28px;
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .card, .card-hint, .icon-wrap, .continue { animation: none !important; transition: none !important; }
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px 24px 24px;
      border-radius: 28px;
      background: rgba(12, 16, 28, 0.55);
      border: 1px solid rgba(167, 139, 250, 0.22);
      backdrop-filter: blur(22px);
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.38),
        0 0 80px rgba(124, 92, 255, 0.12);
      text-align: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-mark {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(167, 139, 250, 0.12);
      box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.28), 0 12px 30px rgba(124, 92, 255, 0.22);
    }
    .logo-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.1rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      background: linear-gradient(125deg, #eef0ff 8%, #a78bfa 48%, #38bdf8 78%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .logo-sub {
      font-size: 0.82rem;
      color: #8b93b8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .search-wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
    }
    .search-wrap > svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      stroke: #7b84a8;
      fill: none;
      stroke-width: 2;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      height: 48px;
      padding: 0 52px 0 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #eef0fb;
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .search-wrap input::placeholder { color: #5c6588; }
    .search-wrap input:focus {
      border-color: rgba(167, 139, 250, 0.55);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.16);
    }
    .search-wrap kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 28px;
      height: 26px;
      padding: 0 8px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(8, 10, 18, 0.65);
      color: #8b93b8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .search-wrap:focus-within kbd { opacity: 0; }

    .continue {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.28);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .continue.is-visible { display: flex; }
    .continue:hover {
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.5);
      background: rgba(167, 139, 250, 0.16);
    }
    .continue-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .continue-icon svg { width: 22px; height: 22px; stroke-width: 1.85; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .continue-copy { flex: 1; min-width: 0; text-align: left; }
    .continue-kicker {
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c4b5fd;
      margin-bottom: 2px;
    }
    .continue-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
    }
    .continue-go {
      font-size: 0.78rem;
      color: #c4b5fd;
      white-space: nowrap;
    }

    .filters {
      position: sticky;
      top: 10px;
      z-index: 6;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(10, 14, 24, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }
    .filter-chip {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #b4bcd8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .filter-chip b {
      font-weight: 700;
      font-size: 0.68rem;
      color: #8b93b8;
    }
    .filter-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(167, 139, 250, 0.4);
      color: #fff;
    }
    .filter-chip.active {
      background: color-mix(in srgb, #7c5cff 28%, #12121a);
      border-color: rgba(167, 139, 250, 0.65);
      color: #fff;
      box-shadow: 0 10px 24px rgba(124, 92, 255, 0.22);
    }
    .filter-chip.active b { color: #e4d9ff; }
    .filter-chip:focus-visible,
    .card:focus-visible,
    .continue:focus-visible,
    .search-wrap input:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }

    .search-empty {
      display: none;
      text-align: center;
      color: #8b93b8;
      font-size: 0.92rem;
      padding: 32px 0;
    }
    .search-empty.is-visible { display: block; }
    .card[hidden],
    .hub-section[hidden],
    .continue[hidden] { display: none !important; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      width: 100%;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 22px 20px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: cardIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition:
        background 0.24s ease,
        border-color 0.24s ease,
        transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.24s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--c-bar);
      opacity: 0.85;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--c-glow);
      opacity: 0;
      transition: opacity 0.24s;
      pointer-events: none;
    }
    .card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.52), var(--c-shadow);
    }
    .card:hover::after { opacity: 1; }
    .card:active {
      transform: translateY(-2px) scale(1.003);
      transition-duration: 0.1s;
    }
    .card.is-last {
      border-color: rgba(167, 139, 250, 0.42);
      box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.18);
    }
    .card.is-here {
      border-color: rgba(52, 211, 153, 0.35);
    }
    .card-recent {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c4b5fd;
      font-weight: 600;
    }
    .card.is-here .card-recent { color: #6ee7b7; }

    .icon-wrap {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 16px;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card:hover .icon-wrap { transform: scale(1.1); }
    .icon-wrap svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.08rem;
      font-weight: 600;
      color: #f3f5ff;
      margin-bottom: 6px;
      padding-right: 64px;
    }
    .card-desc {
      font-size: 0.84rem;
      color: #9aa3c4;
      line-height: 1.55;
      flex: 1;
    }
    .card-hint {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      color: #8b93b8;
      margin-top: 16px;
      opacity: 0.55;
      transform: translateX(-4px);
      transition: opacity 0.22s, transform 0.22s, color 0.22s;
    }
    .card:hover .card-hint { opacity: 1; transform: translateX(0); color: #c4b5fd; }
    .card-hint svg {
      width: 13px; height: 13px;
      stroke: currentColor;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      font-size: 0.78rem;
      color: #6d7696;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .hub-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 12px;
      padding: 0 4px;
    }
    .section-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c4cadf;
    }
    .section-count {
      font-size: 0.68rem;
      font-weight: 600;
      color: #8b93b8;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .section-blurb {
      flex-basis: 100%;
      font-size: 0.8rem;
      color: #7b84a8;
    }

    @media (max-width: 600px) {
      body { padding: 20px 14px 36px; }
      .header { padding: 22px 16px 18px; border-radius: 22px; }
      .wrap { gap: 20px; }
      .card-name { padding-right: 0; }
      .filters { top: 8px; }
    }
  </style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="wrap">

  <header class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="fg" x1="0" y1="0" x2="54" y2="54" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#a78bfa"/>
              <stop offset="50%"  stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
          </defs>
          <path d="M8 25 L15 3 L23 23 Z"  fill="url(#fg)" opacity="0.9"/>
          <path d="M46 25 L39 3 L31 23 Z" fill="url(#fg)" opacity="0.9"/>
          <ellipse cx="27" cy="32" rx="18" ry="16" fill="url(#fg)" opacity="0.82"/>
          <circle cx="21"  cy="29" r="2.5" fill="#060811"/>
          <circle cx="33"  cy="29" r="2.5" fill="#060811"/>
          <circle cx="21.8" cy="28.1" r="0.75" fill="white" opacity="0.55"/>
          <circle cx="33.8" cy="28.1" r="0.75" fill="white" opacity="0.55"/>
          <ellipse cx="27" cy="36" rx="2" ry="1.35" fill="#060811"/>
        </svg>
      </div>
      <span class="logo-title">FOX HUB</span>
    </div>
    <p class="logo-sub">Локальні сайти FoxTerminal</p>
    <div class="search-wrap" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="hub-search" type="search" placeholder="Пошук сайтів…" autocomplete="off" spellcheck="false" aria-label="Пошук сайтів">
      <kbd>/</kbd>
    </div>
  </header>

  <a class="continue" id="continue" hidden></a>
  <div class="filters" id="filters" role="group" aria-label="Категорії"></div>
  <main id="sections" style="display:flex;flex-direction:column;gap:32px;width:100%"></main>
  <p class="search-empty" id="search-empty">Нічого не знайдено</p>

  <footer class="footer" id="hub-footer">FoxTerminal · Local Sites</footer>
</div>

<script src="catalog.js"></script>
<script>

const ICONS = {

  bag: `<svg viewBox="0 0 24 24" stroke="currentColor"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>`,
  word: `<svg viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="4" height="5" rx="1"/><rect x="3" y="17" width="5" height="4" rx="1"/><rect x="10" y="17" width="5" height="4" rx="1"/></svg>`,
  d20: `<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="12 2 21 8 21 16 12 22 3 16 3 8"/><path d="M12 2v20M3 8l9 4 9-4M3 16l9-4 9 4"/></svg>`,
  map: `<svg viewBox="0 0 24 24" stroke="currentColor"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>`,
  film: `<svg viewBox="0 0 24 24" stroke="currentColor"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 9h5M2 15h5M17 9h5M17 15h5"/></svg>`
};

let activeCat = 'all';

function resolveUrl(raw) {
  if (!raw) return '#';
  return raw.replace(/^\.\//, '../');
}

function siteMeta(id) {
  return SITE_META[id] || { color: '#7c5cff', icon: 'box' };
}

function renderCard(site) {
  const meta = siteMeta(site.id);
  const color = meta.color;
  const icon = ICONS[meta.icon] || ICONS.box;
  const lastId = localStorage.getItem('foxhub-last');
  const isHere = site.id === 'hub';
  const last = lastId === site.id && !isHere;
  const card = document.createElement('a');
  card.className = 'card' + (last ? ' is-last' : '') + (isHere ? ' is-here' : '');
  card.href = resolveUrl(site.url);
  if (isHere) card.setAttribute('aria-current', 'page');
  card.style.setProperty('--c-glow', `radial-gradient(ellipse at 0% 0%, ${color}22 0%, transparent 62%)`);
  card.style.setProperty('--c-shadow', `0 0 50px ${color}22`);
  card.style.setProperty('--c-bar', `linear-gradient(90deg, ${color}, transparent)`);
  card.dataset.search = `${site.name} ${site.description} ${site.id}`.toLowerCase();
  card.dataset.id = site.id;
  card.addEventListener('click', () => localStorage.setItem('foxhub-last', site.id));
  const badge = isHere ? 'ви тут' : (last ? 'недавно' : '');
  card.innerHTML = `
    <div class="icon-wrap" style="background:${color}22; box-shadow: 0 0 0 1px ${color}40, 0 10px 24px ${color}24; color:${color}">${icon}</div>
    ${badge ? `<span class="card-recent" aria-hidden="true">${badge}</span>` : ''}
    <div class="card-name">${site.name}</div>
    <div class="card-desc">${site.description}</div>
    <div class="card-hint">${ARROW} ${isHere ? 'оновити' : 'відкрити'}</div>`;
  return card;
}

function applyFilters() {
  const q = (document.getElementById('hub-search').value || '').trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.hub-section').forEach(section => {
    const catOk = activeCat === 'all' || section.dataset.cat === activeCat;
    let n = 0;
    section.querySelectorAll('.card').forEach(card => {
      const show = catOk && (!q || (card.dataset.search || '').includes(q));
      card.hidden = !show;
      if (show) n++;
    });
    section.hidden = n === 0;
    visible += n;
  });
  document.getElementById('search-empty').classList.toggle('is-visible', visible === 0);
}

function renderContinue(sites) {
  const el = document.getElementById('continue');
  const lastId = localStorage.getItem('foxhub-last');
  const site = sites.find(s => s.id === lastId && s.id !== 'hub');
  if (!site) {
    el.hidden = true;
    el.classList.remove('is-visible');
    return;
  }
  const meta = siteMeta(site.id);
  const color = meta.color;
  const icon = ICONS[meta.icon] || ICONS.box;
  el.hidden = false;
  el.classList.add('is-visible');
  el.href = resolveUrl(site.url);
  el.innerHTML = `
    <div class="continue-icon" style="background:${color}22; color:${color}; box-shadow: 0 0 0 1px ${color}40">${icon}</div>
    <div class="continue-copy">
      <div class="continue-kicker">Продовжити</div>
      <div class="continue-name">${site.name}</div>
    </div>
    <div class="continue-go">відкрити →</div>`;
}

function renderFilters(categories, total) {
  const root = document.getElementById('filters');
  root.innerHTML = '';
  const make = (id, label, count) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-chip' + (activeCat === id ? ' active' : '');
    btn.dataset.cat = id;
    btn.setAttribute('aria-pressed', activeCat === id ? 'true' : 'false');
    btn.innerHTML = `${label} <b>${count}</b>`;
    btn.addEventListener('click', () => {
      activeCat = id;
      root.querySelectorAll('.filter-chip').forEach(c => {
        const on = c.dataset.cat === id;
        c.classList.toggle('active', on);
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      applyFilters();
    });
    return btn;
  };
  root.appendChild(make('all', 'Усі', total));
  categories.forEach(cat => {
    root.appendChild(make(cat.id, cat.name, (cat.sites || []).length));
  });
}

async function readCatalog() {
  try {
    const res = await fetch('../sites.json', { cache: 'no-store' });
    if (res.ok) return await res.json();
  } catch (_) { /* file:// blocks fetch; catalog.js is the fallback */ }
  return window.FOX_SITES || null;
}

async function loadHub() {
  const root = document.getElementById('sections');
  try {
    const data = await readCatalog();
    if (!data || !(data.categories || []).length) {
      throw new Error('empty catalog');
    }
    const categories = data.categories || [];
    const sites = categories.flatMap(c => c.sites || []);
    let total = 0;
    categories.forEach(cat => {
      const section = document.createElement('section');
      section.className = 'hub-section';
      section.dataset.cat = cat.id;
      const count = (cat.sites || []).length;
      section.innerHTML = `
        <div class="section-head">
          <div class="section-name">${cat.name}</div>
          <span class="section-count">${count}</span>
          <div class="section-blurb">${cat.blurb || ''}</div>
        </div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';
      (cat.sites || []).forEach((site, i) => {
        const card = renderCard(site);
        card.style.animationDelay = `${Math.min(total + i, 16) * 40}ms`;
        grid.appendChild(card);
      });
      section.appendChild(grid);
      root.appendChild(section);
      total += count;
    });
    renderFilters(categories, total);
    renderContinue(sites);
    const footer = document.getElementById('hub-footer');
    if (footer) footer.textContent = `FoxTerminal · ${total} локальних сайтів`;
  } catch (e) {
    root.innerHTML = '<p style="color:#8b93b8">Не вдалося завантажити каталог сайтів</p>';
  }
}

const searchInput = document.getElementById('hub-search');
searchInput.addEventListener('input', applyFilters);
document.addEventListener('keydown', (e) => {
  const typing = document.activeElement === searchInput;
  if (e.key === '/' && !typing) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === 'Escape') {
    searchInput.value = '';
    applyFilters();
    searchInput.blur();
  }
  if (e.key === 'Enter' && typing) {
    const first = [...document.querySelectorAll('.card')].find((c) => !c.hidden);
    if (first) first.click();
  }
});

loadHub();
</script>
