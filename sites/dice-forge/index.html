<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Roll — Dice Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-theme="default">
  <canvas id="bgCanvas"></canvas>
  <canvas id="sparks"></canvas>

  <div class="app">

    <!-- ═══ Header ═══════════════════════════════════════════════════════ -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">⬡</div>
        <div class="brand-text">
          <span class="brand-name">Dice Forge</span>
          <span class="brand-sub" id="themeSub">neon glass · roll anything</span>
        </div>
      </div>
      <nav class="theme-bar">
        <button class="t-btn active" data-theme="default">Default</button>
        <button class="t-btn"        data-theme="dnd">DND</button>
        <button class="t-btn"        data-theme="dota">Dota</button>
        <button class="t-btn"        data-theme="roll">Roll</button>
        <button class="t-btn"        data-theme="cyber">Cyber</button>
        <button class="t-btn"        data-theme="space">Space</button>
        <button class="t-btn"        data-theme="arcane">Arcane</button>
      </nav>
      <div class="header-actions">
        <a class="hub-link" href="../hub/index.html">Hub</a>
        <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83
                   l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83
                   l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83
                   l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      </div>
    </header>

    <!-- ═══ Settings panel ═══════════════════════════════════════════════ -->
    <div class="settings-panel" id="settingsPanel" style="display:none">
      <div class="sett-grid">
        <div class="sett-row">
          <div class="sett-info">
            <span class="sett-name">Particles</span>
            <span class="sett-desc">Visual effects on roll</span>
          </div>
          <label class="toggle-sw">
            <input type="checkbox" id="partToggle" checked>
            <span class="sw-track"><span class="sw-thumb"></span></span>
          </label>
        </div>
        <div class="sett-row sett-sub" id="partLevelRow">
          <span class="sett-name">Intensity</span>
          <div class="seg-ctrl">
            <button class="seg-btn active" data-level="1">Low</button>
            <button class="seg-btn"        data-level="2">Mid</button>
            <button class="seg-btn"        data-level="3">High</button>
          </div>
        </div>
        <div class="sett-sep"></div>
        <div class="sett-row">
          <div class="sett-info">
            <span class="sett-name">Sound</span>
            <span class="sett-desc">Roll & land audio effects</span>
          </div>
          <label class="toggle-sw">
            <input type="checkbox" id="soundToggle" checked>
            <span class="sw-track"><span class="sw-thumb"></span></span>
          </label>
        </div>
        <div class="sett-row sett-sub" id="volRow">
          <span class="sett-name">Volume</span>
          <div class="vol-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <input type="range" id="volRange" min="0" max="100" value="50" class="vol-range">
            <span id="volVal">50</span>
          </div>
        </div>
        <div class="sett-sep"></div>
        <div class="sett-row">
          <div class="sett-info">
            <span class="sett-name">Font</span>
            <span class="sett-desc">UI typeface</span>
          </div>
          <select id="fontSel" class="sett-select">
            <option value="Inter">Inter</option>
            <option value="JetBrains Mono">Monospace</option>
            <option value="Cinzel">Cinzel</option>
            <option value="Orbitron">Orbitron</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ═══ Main ══════════════════════════════════════════════════════════ -->
    <main class="main">

      <!-- Stage: die display -->
      <div class="stage-panel">
        <div class="die-orbit-wrap">
          <div class="orbit orbit-1"></div>
          <div class="orbit orbit-2"></div>
          <svg id="dieSvg" class="die-svg" viewBox="0 0 200 200"
               xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="die-type-label" id="dieLabel">d6</div>
      </div>

      <!-- Right: result + controls -->
      <div class="right-panel">

        <!-- Result card -->
        <div class="result-card">
          <div class="result-lbl">Result</div>
          <div class="result-num" id="resultNum">—</div>
          <div class="result-detail" id="resultDetail"></div>
        </div>

        <!-- Die type pills -->
        <div class="ctrl-group">
          <div class="ctrl-group-lbl">Die Type</div>
          <div class="die-pills">
            <button class="die-pill" data-sides="4">d4</button>
            <button class="die-pill active" data-sides="6">d6</button>
            <button class="die-pill" data-sides="8">d8</button>
            <button class="die-pill" data-sides="10">d10</button>
            <button class="die-pill" data-sides="12">d12</button>
            <button class="die-pill" data-sides="20">d20</button>
            <button class="die-pill" data-sides="100">d100</button>
          </div>
        </div>

        <!-- Count + Roll -->
        <div class="ctrl-group">
          <div class="ctrl-group-lbl">Roll</div>
          <div class="roll-row">
            <div class="count-box">
              <button class="cnt-btn" id="decBtn">−</button>
              <span class="cnt-val"   id="countVal">1</span>
              <button class="cnt-btn" id="incBtn">+</button>
            </div>
            <button class="btn-roll" id="rollBtn">Roll</button>
          </div>
        </div>

        <!-- Start / Stop -->
        <div class="startstop-row" id="startstopRow">
          <button class="btn-start" id="startBtn">▶ Start</button>
          <button class="btn-stop"  id="stopBtn" style="display:none">■ Stop</button>
        </div>

      </div>
    </main>

    <!-- ═══ History ════════════════════════════════════════════════════════ -->
    <section class="history-panel">
      <div class="history-head">
        <span class="history-title">Roll History</span>
        <button class="history-clear" id="clearBtn">Clear</button>
      </div>
      <ul class="history-list" id="histList"></ul>
      <p class="history-empty" id="histEmpty">No rolls yet — hit Roll!</p>
    </section>

  </div><!-- .app -->

  <script src="./assets/js/main.js"></script>
</body>
</html>
