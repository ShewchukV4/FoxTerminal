<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FoxMirror</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/viewer.css?v=3">
<script>
try {
  localStorage.setItem("tray-left", "collapsed");
  localStorage.setItem("tray-right", "collapsed");
} catch (e) {}
</script>
</head>
<body class="fox">
<div id="workspace">
 <aside id="left-tray" class="tray collapsed" hidden>
  <button class="tray-toggle btn" data-tray="left" aria-hidden="true">‹</button>
  <div class="tray-content">
   <button class="btn" id="style-toggle" type="button">Style</button>
   <button class="btn" id="frame-toggle" type="button">Frame</button>
   <button class="btn" id="reload-window" type="button">Reload</button>
   <button class="btn" id="restart" type="button">Restart</button>
  </div>
 </aside>

 <div id="stage-wrap">
  <div id="stage">
   <div id="side-left" class="side" hidden>
    <button class="btn" data-btn="mute"></button>
    <button class="btn" data-btn="volume-up"></button>
    <button class="btn" data-btn="volume-down"></button>
   </div>
   <div id="device-frame">
    <canvas id="c" tabindex="0" width="390" height="844"></canvas>
    <div id="offline-overlay" class="hidden"><span>waiting for the phone…</span></div>
   </div>
   <div id="side-right" class="side" hidden>
    <button class="btn" data-btn="siri"></button>
   </div>
  </div>
  <div id="bottom-row" hidden>
   <button class="btn" data-swipe="left">←</button>
   <button class="btn" data-swipe="right">→</button>
  </div>
 </div>

 <aside id="right-tray" class="tray collapsed" hidden>
  <button class="tray-toggle btn" data-tray="right">›</button>
  <div class="tray-content">
   <h3>Clipboard <button class="btn" id="clipboard-toggle" type="button">on</button></h3>
   <div id="clipboard-panel">
    <textarea id="clipboard-text" rows="3"></textarea>
    <div class="clipboard-row">
     <button class="btn" id="clipboard-send" type="button">Send</button>
     <button class="btn" id="clipboard-get" type="button">Get</button>
    </div>
   </div>
   <h3>Accessibility</h3>
   <div id="accessibility-list"></div>
   <button class="btn" id="accessibility-reset" type="button">Reset</button>
  </div>
 </aside>
</div>

<nav id="dock" aria-label="Controls">
  <button class="icon" data-btn="home" title="Home  Ctrl+H" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button class="icon" data-btn="lock" title="Lock  Ctrl+L" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
  </button>
  <button class="icon" id="screenshot" title="Screenshot  Ctrl+P" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button class="icon" id="rotate-left" title="Rotate left" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="icon" id="rotate-right" title="Rotate right" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
  </button>
  <button class="icon" data-btn="volume-down" title="Volume down" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"/></svg>
  </button>
  <button class="icon" data-btn="volume-up" title="Volume up" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M17.5 7a6 6 0 0 1 0 10"/></svg>
  </button>
  <button class="icon" id="sound-toggle" title="Sound" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  </button>
  <button class="icon" id="help-toggle" title="Shortcuts  ?" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.7.4-1.4 1-1.4 1.7V14"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></svg>
  </button>
</nav>

<div id="fps">— fps</div>
<div id="kb-indicator" class="hidden" aria-hidden="true">
 <svg viewBox="0 0 48 28" width="32" height="18" aria-hidden="true">
  <rect x="1" y="1" width="46" height="26" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="12" y="17" width="24" height="4" rx="1" fill="currentColor"/>
 </svg>
</div>
<div id="status">connecting…</div>
<div id="help-overlay" class="hidden">
 <div id="help-modal" role="dialog" aria-modal="true">
  <button id="help-close" class="btn" type="button" aria-label="Close">×</button>
  <h2>Shortcuts</h2>
  <table>
   <tr><th>Key</th><th>Action</th></tr>
   <tr><td>Ctrl + H</td><td>Home</td></tr>
   <tr><td>Ctrl + L</td><td>Lock</td></tr>
   <tr><td>Ctrl + P</td><td>Screenshot</td></tr>
   <tr><td>?</td><td>Help</td></tr>
   <tr><td>Esc</td><td>Close</td></tr>
  </table>
  <p>Like scrcpy: the window is the phone. Hover the bottom edge for controls. Click the screen to tap.</p>
 </div>
</div>
<script src="/viewer.js?v=3"></script>
</body>
</html>
